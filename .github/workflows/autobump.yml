name: Autobump casks

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autobump
  cancel-in-progress: false

jobs:
  autobump:
    runs-on: macos-15
    steps:
      - name: Check autobump token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$HOMEBREW_TAP_TOKEN" || { echo "::error::Set the HOMEBREW_TAP_TOKEN repository secret."; exit 1; }

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: false
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          brew-gh-api-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Open and queue pull requests for newer cask versions
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          output=$(brew bump --full-name --tap="${GITHUB_REPOSITORY_OWNER}/tap" --no-fork --open-pr 2>&1) || {
            printf '%s\n' "$output"
            exit 1
          }

          printf '%s\n' "$output"
          while IFS= read -r pr_url; do
            gh pr merge "$pr_url" --auto --squash
          done < <(printf '%s\n' "$output" | sed -nE '/^https:\/\/github\.com\/[^[:space:]]+\/pull\/[0-9]+$/p')
